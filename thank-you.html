<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Received — Obafunso Ahmed Olamide</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .confirmation-card {
      max-width: 580px;
      margin: 120px auto;
      padding: 3rem 2.5rem;
      background: var(--bg-surface-glass);
      border: 1px solid var(--border-active);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5), var(--shadow-glow);
    }
    .check-icon {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: var(--accent-alpha-12);
      border: 1px solid var(--accent-alpha-30);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent-primary);
    }
  </style>
</head>
<body>
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  
  <main class="container">
    <div class="confirmation-card">
      <div class="check-icon">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <div class="mono-badge">TRANSMISSION ACKNOWLEDGED [200 OK]</div>
      <h1 class="headline-lg" style="margin-top: 1rem;">Message Received</h1>
      <p class="text-muted" style="margin-top: 1rem; font-size: 1.1rem; line-height: 1.6;">
        Thank you for reaching out. Your transmission has been queued into Obafunso Ahmed Olamide's inbox. You will receive a response shortly.
      </p>
      <div style="margin-top: 2rem;">
        <a href="/" class="btn btn-primary">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Return to Terminal / Home
        </a>
      </div>
    </div>
  </main>
</body>
</html>
